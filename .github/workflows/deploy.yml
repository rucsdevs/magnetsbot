name: Deploy

# Deploys to the EC2 host on every push to main, after CI would have run on
# the same commit. Requires these repository secrets:
#   EC2_HOST        public DNS or IP of the instance
#   EC2_SSH_KEY     private key for the deploy user
#   BOT_TOKEN       Discord bot token
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t star:latest .

      - name: Save image as tarball
        run: docker save star:latest | gzip > star.tar.gz

      - name: Copy image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: star.tar.gz
          target: /home/ubuntu/

      - name: Restart container on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            docker load < /home/ubuntu/star.tar.gz
            docker stop star || true
            docker rm star || true
            docker run -d \
              --name star \
              --restart unless-stopped \
              -e BOT_TOKEN='${{ secrets.BOT_TOKEN }}' \
              -v star-data:/data \
              star:latest
            rm /home/ubuntu/star.tar.gz
            docker image prune -f
